name: CI/CD Pipeline for Blog Agent

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: 🐳 Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 🐳 Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🔧 Build Docker Image (Backend)
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/blog-agent-backend:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/blog-agent-backend:${{ github.sha }} -f Dockerfile.backend .

      - name: 🚀 Push Docker Image (Backend)
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/blog-agent-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/blog-agent-backend:${{ github.sha }}

      - name: 🔧 Build Docker Image (Frontend)
        run: |
          docker build --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
                       -t ${{ secrets.DOCKER_USERNAME }}/blog-ai-agent:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/blog-ai-agent:${{ github.sha }} -f Dockerfile.frontend .

      - name: 🚀 Push Docker Image (Frontend)
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/blog-ai-agent:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/blog-ai-agent:${{ github.sha }}

      - name: 🧹 Clean Up
        run: docker image prune -f

      - name: 🚀 Trigger Render Deployment (Backend)
        run: curl -X POST ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        
      - name: 🚀 Trigger Render Deployment (Frontend)
        run: curl -X POST ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
